# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Independent typescript deployment. Run all commands from the repository root.
services:
  - type: web
    name: beat-jev-typescript-web
    runtime: node
    repo: https://github.com/ojusave/beat-jev
    branch: main
    region: oregon
    plan: 0.5c-512mb
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build:typescript
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: beat-jev-typescript
          property: slug
      - key: DATABASE_URL
        fromDatabase:
          name: beat-jev-typescript-db
          property: connectionString

  - type: workflow
    name: beat-jev-typescript
    runtime: node
    repo: https://github.com/ojusave/beat-jev
    branch: main
    region: oregon
    autoDeployTrigger: off
    buildCommand: sh scripts/check-keys.sh && npm ci --include=dev
    startCommand: npm run start:workflow
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TYPESAFE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: beat-jev-typescript-db
          property: connectionString

databases:
  - name: beat-jev-typescript-db
    region: oregon
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    diskSizeGB: 1
    ipAllowList: []
